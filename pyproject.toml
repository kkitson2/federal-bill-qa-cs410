[project]
name = "billbridge-data"
version = "0.1.0"
description = "CS410 Group 1 Person 1 bill collection and portable data handoff"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "lxml>=5,<7", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
billbridge-data = "billbridge_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["billbridge_data", "ingestion", "staging", "intermediate", "curated"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "billbridge_data/**/*.py" }, { file = "billbridge_data/**/*.sql" }, { file = "ingestion/**/*.py" }, { file = "staging/**/*.py" }, { file = "intermediate/**/*.py" }, { file = "curated/**/*.py" }]
